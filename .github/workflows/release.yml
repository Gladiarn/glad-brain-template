name: Release

# Pushing a tag named vX.Y.Z creates a GitHub release whose notes are that
# version's section of CHANGELOG.md. I write the section and set the version
# in vault-manifest.json and the plugin before tagging (see CONTRIBUTING.md).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # Only the public template publishes releases; a private brain made from it does not.
    if: github.repository == 'Gladiarn/glad-brain-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the tag is a version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vX.Y.Z"
            exit 1
          fi

      - name: Check the tagged tree carries its own version
        run: |
          want="${GITHUB_REF_NAME#v}"
          manifest=$(node -p "require('./vault-manifest.json').version")
          plugin=$(node -p "require('./.claude/skills/glad-brain/.claude-plugin/plugin.json').version")
          echo "tag=$want vault-manifest=$manifest plugin=$plugin"
          if [ "$manifest" != "$want" ] || [ "$plugin" != "$want" ]; then
            echo "::error::vault-manifest.json and plugin.json must both be $want at the tagged commit"
            exit 1
          fi

      - name: Run tests
        working-directory: .claude/scripts
        run: npm test

      - name: Cut the release notes from CHANGELOG.md
        run: node --experimental-strip-types .github/scripts/release-notes.ts "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi
